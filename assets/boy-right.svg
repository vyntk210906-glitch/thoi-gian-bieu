  <ellipse cx="46" cy="56" rx="4.5" ry="6" fill="#1e293b"/>
  <circle cx="48" cy="54" r="2" fill="#ffffff"/>
  <circle cx="45" cy="58" r="1" fill="#ffffff"/>
  <ellipse cx="74" cy="56" rx="4.5" ry="6" fill="#1e293b"/>
  <circle cx="76" cy="54" r="2" fill="#ffffff"/>
  <circle cx="73" cy="58" r="1" fill="#ffffff"/>
  <!-- Eyebrows -->
  <path d="M40 47 Q46 44 52 47" stroke="#451a03" stroke-width="2.5" stroke-linecap="round" fill="none"/>
  <path d="M68 47 Q74 44 80 47" stroke="#451a03" stroke-width="2.5" stroke-linecap="round" fill="none"/>
  <!-- Cheeks Blush -->
  <ellipse cx="38" cy="65" rx="6" ry="3.5" fill="#fca5a5" opacity="0.65"/>
  <ellipse cx="82" cy="65" rx="6" ry="3.5" fill="#fca5a5" opacity="0.65"/>
  <!-- Smile -->
  <path d="M52 66 Q60 76 68 66" stroke="#991b1b" stroke-width="2.5" stroke-linecap="round" fill="#ef4444"/>
