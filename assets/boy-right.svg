  <rect x="68" y="96" width="30" height="36" rx="4" fill="#f97316" stroke="#ea580c" stroke-width="1.5" transform="rotate(-8 68 96)"/>
  <path d="M72 98 L94 95 L95 125 L73 128 Z" fill="#fed7aa" transform="rotate(-8 68 96)"/>
  <rect x="66" y="96" width="6" height="36" rx="2" fill="#c2410c" transform="rotate(-8 68 96)"/>
