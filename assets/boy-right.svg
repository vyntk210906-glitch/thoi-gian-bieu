  <ellipse cx="60" cy="55" rx="32" ry="34" fill="#fed7aa" filter="url(#shadow-right)"/>
  <!-- Ears -->
  <circle cx="28" cy="56" r="7" fill="#fed7aa"/>
  <circle cx="28" cy="56" r="4" fill="#fbcfe8"/>
  <circle cx="92" cy="56" r="7" fill="#fed7aa"/>
  <circle cx="92" cy="56" r="4" fill="#fbcfe8"/>
  <!-- Hair Base & Bangs -->
  <path d="M28 50 C26 28 40 18 60 18 C80 18 94 28 92 50 C88 38 78 32 60 32 C42 32 32 38 28 50 Z" fill="#451a03"/>
  <path d="M30 46 C34 32 46 25 60 26 C74 27 86 34 90 46 C83 40 76 41 68 45 C60 49 52 43 44 43 C37 43 33 45 30 46 Z" fill="#78350f"/>
