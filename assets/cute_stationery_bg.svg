<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 760" width="1080" height="760">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#d8f0fd" />
      <stop offset="35%" stop-color="#eaf5fe" />
      <stop offset="100%" stop-color="#dff2fd" />
    </linearGradient>

    <!-- Honeycomb Pattern matching original photo -->
    <pattern id="honeycomb" width="30" height="51.96" patternUnits="userSpaceOnUse" patternTransform="scale(0.9)">
      <path d="M 15,0 L 30,8.66 L 30,25.98 L 15,34.64 L 0,25.98 L 0,8.66 Z M 15,51.96 L 30,43.3 L 30,25.98 L 15,17.32 L 0,25.98 L 0,43.3 Z" 
            fill="none" stroke="#4ba8ea" stroke-width="1.3" stroke-opacity="0.22" />
    </pattern>

    <!-- Soft Cloud Filter -->
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Outer Rounded Mat Frame -->
  <rect x="2" y="2" width="1076" height="756" rx="26" ry="26" fill="url(#bgGrad)" stroke="#4ba8ea" stroke-width="4" />

  <!-- Honeycomb decorative zones (corners & header sides matching original photo) -->
  <rect x="10" y="10" width="230" height="140" fill="url(#honeycomb)" rx="18" opacity="0.85" />
  <rect x="840" y="10" width="230" height="140" fill="url(#honeycomb)" rx="18" opacity="0.85" />
  <rect x="10" y="630" width="210" height="120" fill="url(#honeycomb)" rx="18" opacity="0.6" />
  <rect x="860" y="630" width="210" height="120" fill="url(#honeycomb)" rx="18" opacity="0.6" />

  <!-- Soft pastel cloud puffs -->
  <g fill="#ffffff" fill-opacity="0.6" filter="url(#softGlow)">
    <path d="M 25,60 Q 45,35 70,45 Q 95,30 120,48 Q 145,45 150,68 Q 120,82 25,75 Z" />
    <path d="M 930,60 Q 955,35 980,45 Q 1005,30 1030,48 Q 1055,45 1060,68 Q 1030,82 930,75 Z" />
    <circle cx="85" cy="740" r="26" />
    <circle cx="115" cy="745" r="20" />
    <circle cx="995" cy="740" r="26" />
    <circle cx="965" cy="745" r="20" />
  </g>

  <!-- Sparkle Stars -->
  <g fill="#facc15" fill-opacity="0.9">
    <path d="M 168,32 Q 168,40 176,40 Q 168,40 168,48 Q 168,40 160,40 Q 168,40 168,32 Z" />
    <path d="M 912,34 Q 912,42 920,42 Q 912,42 912,50 Q 912,42 904,42 Q 912,42 912,34 Z" />
    <circle cx="195" cy="54" r="2.5" fill="#60a5fa" />
    <circle cx="885" cy="52" r="2.5" fill="#60a5fa" />
  </g>
</svg>
