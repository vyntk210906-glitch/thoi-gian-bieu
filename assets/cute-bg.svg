<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 780" width="100%" height="100%" preserveAspectRatio="none">
  <defs>
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#eff6ff" />
      <stop offset="40%" stop-color="#e0f2fe" />
      <stop offset="100%" stop-color="#f0fdf4" />
    </linearGradient>
    <filter id="softGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Sky Base -->
  <rect width="1100" height="780" rx="28" fill="url(#skyGrad)" />

  <!-- Soft pastel cloud shapes in corners & background -->
  <!-- Top Left Cloud -->
  <path d="M -20 80 Q 20 40 70 60 Q 120 20 170 55 Q 220 30 250 80 Q 270 120 240 140 Q 160 160 80 140 Q -10 130 -20 80 Z" fill="#ffffff" opacity="0.65" />
  
  <!-- Top Right Cloud -->
  <path d="M 850 60 Q 900 15 960 45 Q 1020 20 1060 65 Q 1120 70 1120 120 Q 1080 150 1000 140 Q 920 150 870 110 Q 830 85 850 60 Z" fill="#ffffff" opacity="0.65" />

  <!-- Bottom Left Clouds -->
  <path d="M -10 680 Q 40 640 100 665 Q 160 635 220 670 Q 260 720 220 760 Q 140 790 60 780 Q -20 750 -10 680 Z" fill="#ffffff" opacity="0.6" />

  <!-- Bottom Right Clouds -->
  <path d="M 880 700 Q 940 650 1000 680 Q 1060 650 1110 700 Q 1120 760 1050 780 Q 960 790 900 760 Q 860 730 880 700 Z" fill="#ffffff" opacity="0.6" />

  <!-- Cute floating pastel bubbles -->
  <circle cx="120" cy="220" r="14" fill="#fed7aa" opacity="0.4" />
  <circle cx="140" cy="250" r="8" fill="#fbcfe8" opacity="0.5" />
  <circle cx="980" cy="240" r="16" fill="#bae6fd" opacity="0.45" />
  <circle cx="960" cy="280" r="9" fill="#fef08a" opacity="0.5" />
  <circle cx="80" cy="520" r="18" fill="#bbf7d0" opacity="0.4" />
  <circle cx="1020" cy="560" r="15" fill="#fbcfe8" opacity="0.4" />

  <!-- Golden Stars & Sparkles -->
  <g fill="#f59e0b" opacity="0.85">
    <!-- Top left star -->
    <path d="M 190 40 L 193 50 L 203 53 L 193 56 L 190 66 L 187 56 L 177 53 L 187 50 Z" />
    <circle cx="215" cy="70" r="3" fill="#fbbf24" />
    <!-- Top right star -->
    <path d="M 890 35 L 893 45 L 903 48 L 893 51 L 890 61 L 887 51 L 877 48 L 887 45 Z" />
    <circle cx="865" cy="65" r="2.5" fill="#fbbf24" />
    <!-- Left middle star -->
    <path d="M 45 340 L 47 348 L 55 350 L 47 352 L 45 360 L 43 352 L 35 350 L 43 348 Z" />
    <!-- Right middle star -->
    <path d="M 1055 380 L 1057 388 L 1065 390 L 1057 392 L 1055 400 L 1053 392 L 1045 390 L 1053 388 Z" />
  </g>

  <!-- Cute mini rainbow arc near top left -->
  <g opacity="0.45" transform="translate(40, 25)">
    <path d="M 0 50 A 45 45 0 0 1 90 50" stroke="#f43f5e" stroke-width="4" fill="none" stroke-linecap="round" />
    <path d="M 5 50 A 40 40 0 0 1 85 50" stroke="#fbbf24" stroke-width="4" fill="none" stroke-linecap="round" />
    <path d="M 10 50 A 35 35 0 0 1 80 50" stroke="#34d399" stroke-width="4" fill="none" stroke-linecap="round" />
    <path d="M 15 50 A 30 30 0 0 1 75 50" stroke="#38bdf8" stroke-width="4" fill="none" stroke-linecap="round" />
  </g>

  <!-- Cute outer frame with double rounded line -->
  <rect x="10" y="10" width="1080" height="760" rx="22" fill="none" stroke="#38bdf8" stroke-width="3" />
  <rect x="16" y="16" width="1068" height="748" rx="18" fill="none" stroke="#7dd3fc" stroke-width="1.5" stroke-dasharray="6 5" />
</svg>
